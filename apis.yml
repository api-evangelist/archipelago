aid: archipelago
name: Archipelago
description: >-
  Archipelago is a San Francisco-based insurtech company, founded in 2018, that operates an
  AI-powered platform and agent for property and casualty (P&C) insurance risk data. Its software
  helps commercial property owners, brokers, and insurance underwriters ingest, remediate, enrich,
  and centralize Statement of Values (SOV) data and property documents, making risk information
  model-ready for submission to insurance markets. Archipelago exposes a customer-facing GraphQL
  API so customers can use their property data in custom applications, and the platform holds a
  SOC 2 Type 2 attestation. The company is backed by Canaan Partners, Scale Venture Partners,
  Ignition Partners, Prologis Ventures, Stone Point Capital, and Zigg Capital.
